<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>디스코드 봇 & 설정 파일 제어 패널</title>
    <style>
        body { font-family: '맑은 고딕', sans-serif; background-color: #1e1e1e; color: #fff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #2d2d2d; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        select { padding: 8px; width: 300px; background: #1e1e1e; color: #fff; border: 1px solid #444; margin-bottom: 15px; }
        button { padding: 10px 15px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; margin-bottom: 10px; }
        .btn-start { background: #4CAF50; color: white; }
        .btn-stop { background: #F44336; color: white; }
        .btn-refresh { background: #2196F3; color: white; }
        .btn-create { background: #FF9800; color: white; }
        .btn-edit { background: #9C27B0; color: white; }
        .btn-cmd { background: #607D8B; color: white; }
        #logBox { margin-top: 15px; padding: 10px; background: #000; border: 1px solid #444; height: 250px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; color: #4af626; }
        .cmd-box { display: flex; margin-top: 10px; gap: 5px; }
        .cmd-input { flex: 1; padding: 8px; background: #1e1e1e; color: #fff; border: 1px solid #444; font-family: Consolas, monospace; }
        
        #editorModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #252526; width: 800px; height: 600px; padding: 20px; border-radius: 6px; display: flex; flex-direction: column; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .modal-header h3 { margin: 0; color: #fff; }
        textarea.code-editor { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: Consolas, monospace; font-size: 14px; padding: 10px; border: 1px solid #333; resize: none; line-height: 1.4; outline: none; }
        .modal-footer { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📂 파일 관리 & 봇 제어 패널</h2>
        <p>파일을 추가하거나 드롭다운을 <strong>더블클릭</strong>하여 코드를 수정(`Ctrl + S`로 저장)하세요.</p>
        
        <label>서버 파일 목록 (.py, .txt 등):</label><br>
        <select id="fileSelect" size="6" style="width: 100%; height: 120px;" ondblclick="openEditorSelected()">
            <option value="">파일 목록 불러오는 중...</option>
        </select><br>
        
        <button class="btn-refresh" onclick="loadFiles()">새로고침</button>
        <button class="btn-create" onclick="createNewFile()">+ 새 파일 추가</button>
        <button class="btn-edit" onclick="openEditorSelected()">✏️ 코드 수정 (편집)</button><br><br>
        
        <button class="btn-start" onclick="startBot()">선택한 봇 실행하기 (.py)</button>
        <button class="btn-stop" onclick="stopBot()">봇 중지하기</button>
        
        <h3>📡 실시간 콘솔 로그 & 직접 명령어 실행</h3>
        <div id="logBox">대기 중... (명령어나 봇을 실행해 보세요)</div>
        
        <!-- 콘솔 직접 명령어 입력창 -->
        <div class="cmd-box">
            <input type="text" id="cmdInput" class="cmd-input" placeholder="명령어 입력 (예: pip install -U discord.py-self)" onkeypress="if(event.key === 'Enter') sendCommand()">
            <button class="btn-cmd" onclick="sendCommand()">명령어 전송</button>
        </div>
    </div>

    <div id="editorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">파일 편집기</h3>
                <button style="background: #F44336; color: white; padding: 5px 10px;" onclick="closeEditor()">닫기</button>
            </div>
            <textarea id="codeTextArea" class="code-editor" placeholder="코드를 입력하세요..."></textarea>
            <div class="modal-footer">
                <span id="saveStatus">💡 단축키: Ctrl + S를 누르면 즉시 저장됩니다.</span>
                <button class="btn-start" onclick="saveFileContent()">저장하기 (Ctrl+S)</button>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let currentEditingFile = "";

        async function loadFiles() {
            const select = document.getElementById('fileSelect');
            try {
                const response = await fetch('/get_files');
                const result = await response.json();
                select.innerHTML = '';
                if(result.files.length === 0) {
                    select.innerHTML = '<option value="">생성된 파일이 없습니다. [+ 새 파일 추가]를 눌러주세요.</option>';
                    return;
                }
                result.files.forEach(file => {
                    const opt = document.createElement('option');
                    opt.value = file;
                    opt.textContent = file;
                    select.appendChild(opt);
                });
            } catch (e) {
                select.innerHTML = '<option value="">파일 목록 로드 실패</option>';
            }
        }

        async function createNewFile() {
            const filename = prompt("생성할 파일 이름을 입력하세요 (예: config.txt, bot.py):");
            if(!filename) return;

            const response = await fetch('/create_file', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: filename })
            });
            const result = await response.json();
            alert(result.message);
            if(result.status === "success") {
                loadFiles();
            }
        }

        async function openEditorSelected() {
            const filename = document.getElementById('fileSelect').value;
            if(!filename) {
                alert("수정할 파일을 선택해주세요!");
                return;
            }
            currentEditingFile = filename;
            document.getElementById('modalTitle').textContent = `파일 편집 중: ${filename}`;
            
            const response = await fetch(`/read_file?filename=${filename}`);
            const result = await response.json();
            if(result.status === "success") {
                document.getElementById('codeTextArea').value = result.content;
                document.getElementById('editorModal').style.display = 'flex';
                document.getElementById('codeTextArea').focus();
            } else {
                alert(result.message);
            }
        }

        function closeEditor() {
            document.getElementById('editorModal').style.display = 'none';
        }

        async function saveFileContent() {
            if(!currentEditingFile) return;
            const content = document.getElementById('codeTextArea').value;
            
            const response = await fetch('/save_file', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: currentEditingFile, content: content })
            });
            const result = await response.json();
            
            const statusSpan = document.getElementById('saveStatus');
            statusSpan.textContent = result.message;
            setTimeout(() => {
                statusSpan.textContent = "💡 단축키: Ctrl + S를 누르면 즉시 저장됩니다.";
            }, 3000);
        }

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                if(document.getElementById('editorModal').style.display === 'flex') {
                    e.preventDefault();
                    saveFileContent();
                }
            }
        });

        async function startBot() {
            const filename = document.getElementById('fileSelect').value;
            if(!filename) {
                alert("실행할 파일을 선택해주세요!");
                return;
            }
            
            const logBox = document.getElementById('logBox');
            logBox.innerHTML = `[!] '${filename}' 실행 요청 중...<br>`;
            
            const response = await fetch('/start_bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: filename })
            });
            
            const result = await response.json();
            logBox.innerHTML += result.message + "<br>";

            if (eventSource) eventSource.close();

            eventSource = new EventSource(`/stream_logs/${filename}`);
            eventSource.onmessage = function(event) {
                logBox.innerHTML += event.data + "<br>";
                logBox.scrollTop = logBox.scrollHeight;
            };
        }

        async function stopBot() {
            const filename = document.getElementById('fileSelect').value;
            if(!filename) return;
            
            const response = await fetch('/stop_bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: filename })
            });
            
            const result = await response.json();
            document.getElementById('logBox').innerHTML += `<br>${result.message}<br>`;
            
            if (eventSource) eventSource.close();
        }

        // 콘솔 직접 명령어 전송 함수
        async function sendCommand() {
            const input = document.getElementById('cmdInput');
            const cmd = input.value.trim();
            if(!cmd) return;

            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `<br>$ ${cmd}<br>`;

            const response = await fetch('/run_command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            });
            
            input.value = '';

            if (eventSource) eventSource.close();

            eventSource = new EventSource(`/stream_logs/terminal_console`);
            eventSource.onmessage = function(event) {
                logBox.innerHTML += event.data + "<br>";
                logBox.scrollTop = logBox.scrollHeight;
            };
        }

        window.onload = loadFiles;
    </script>
</body>
</html>
