<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>디스코드 봇 멀티 슬롯 관리 패널</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-orange: #f59e0b;
        }

        body { 
            font-family: 'Pretendard', '맑은 고딕', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; padding: 0;
        }

        .top-nav {
            background: #090d16;
            border-bottom: 1px solid var(--panel-border);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-tabs { display: flex; gap: 5px; overflow-x: auto; }
        .tab-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 15px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { color: var(--text-main); border-bottom-color: var(--text-main); }

        .slot-selector-container { display: flex; align-items: center; gap: 10px; }
        .slot-dropdown {
            background: #1e293b; color: #fff; border: 1px solid var(--panel-border);
            padding: 6px 12px; border-radius: 6px; font-size: 13px; outline: none;
        }
        .btn-add-slot {
            background: var(--accent-orange); color: #fff; border: none;
            padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
        }

        .main-content { max-width: 1000px; margin: 25px auto; padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .container {
            background: var(--panel-bg); padding: 25px; border-radius: 12px;
            border: 1px solid var(--panel-border); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        h2 { font-size: 1.2rem; margin-top: 0; border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .status-bar {
            background: #090d16; border: 1px solid var(--panel-border); padding: 15px;
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; font-size: 13px;
        }
        .badge { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .badge.online { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge.offline { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }

        .control-btns button {
            padding: 8px 14px; font-weight: 600; border: none; border-radius: 6px;
            cursor: pointer; margin-right: 5px; font-size: 13px;
        }
        .btn-start-bot { background: var(--accent-green); color: white; }
        .btn-stop-bot { background: var(--accent-red); color: white; }

        #logBox {
            background: #05080f; border: 1px solid var(--panel-border); border-radius: 8px;
            padding: 15px; height: 320px; overflow-y: auto; font-family: 'Consolas', monospace;
            font-size: 12.5px; color: #34d399; line-height: 1.5; margin-bottom: 15px;
        }

        .file-toolbar { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-action { padding: 8px 14px; border-radius: 6px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; color: white; }
        .btn-upload { background: #14b8a6; }
        .btn-create { background: var(--accent-orange); }
        .btn-refresh { background: var(--accent-blue); }
        
        .file-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .file-table th, .file-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--panel-border); }
        .file-table th { color: var(--text-muted); font-weight: 600; }
        .file-row:hover { background: rgba(255,255,255,0.02); }
        .file-actions button { background: transparent; border: none; cursor: pointer; font-size: 14px; margin-right: 8px; }

        .setting-card {
            background: #090d16; border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; margin-bottom: 15px;
        }
        .setting-card label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .setting-card select {
            width: 100%; padding: 10px; background: #1e293b; color: #fff;
            border: 1px solid var(--panel-border); border-radius: 6px; font-size: 14px; outline: none; margin-bottom: 10px;
        }

        .lib-input-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .lib-input-row { display: flex; gap: 8px; align-items: center; }
        .lib-input-row input {
            flex: 1; padding: 9px 12px; background: #1e293b; color: #fff;
            border: 1px solid var(--panel-border); border-radius: 6px; font-size: 13.5px; outline: none;
        }
        .btn-remove-lib {
            background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 9px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;
        }
        .btn-remove-lib:hover { background: rgba(239, 68, 68, 0.4); }

        .lib-control-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-add-lib-field {
            background: #334155; color: white; border: none; padding: 8px 14px;
            border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .btn-add-lib-field:hover { background: #475569; }

        .save-btn {
            background: var(--accent-blue); color: white; border: none;
            padding: 9px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13.5px;
        }
        .save-btn:hover { opacity: 0.9; }

        #editorModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--panel-bg); width: 850px; height: 650px; padding: 25px;
            border-radius: 12px; border: 1px solid var(--panel-border); display: flex; flex-direction: column;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        textarea.code-editor {
            flex: 1; background: #05080f; color: #e2e8f0; font-family: 'Consolas', monospace;
            font-size: 13.5px; padding: 15px; border: 1px solid var(--panel-border); border-radius: 8px;
            resize: none; outline: none; line-height: 1.5;
        }
        .modal-footer { margin-top: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('console')">콘솔</button>
            <button class="tab-btn" onclick="switchTab('quick-setting')">간편 설정</button>
            <button class="tab-btn" onclick="switchTab('file')">파일</button>
            <button class="tab-btn" onclick="switchTab('start-setting')">시작 설정</button>
        </div>
        <div class="slot-selector-container">
            <select id="slotSelect" class="slot-dropdown" onchange="changeActiveSlot()"></select>
            <button class="btn-add-slot" onclick="addNewSlot()">+ 슬롯 추가</button>
        </div>
    </div>

    <div class="main-content">
        <div id="tab-console" class="tab-content active">
            <div class="container">
                <h2>📡 봇 콘솔 및 실시간 로그</h2>
                <div class="status-bar">
                    <div>
                        <span id="slotStatusBadge" class="badge offline">오프라인</span>
                        <span id="slotNameDisplay" style="margin-left: 10px; font-weight: 600;">선택된 봇</span>
                    </div>
                    <div class="control-btns">
                        <button class="btn-start-bot" onclick="startCurrentBot()">▶ 시작</button>
                        <button class="btn-stop-bot" onclick="stopCurrentBot()">⏹ 중지</button>
                    </div>
                </div>
                <div id="logBox">봇을 시작하면 이곳에 실시간 로그가 출력됩니다...</div>
                <button class="btn-action" style="background: #475569;" onclick="document.getElementById('logBox').innerHTML=''">로그 지우기</button>
            </div>
        </div>

        <div id="tab-quick-setting" class="tab-content">
            <div class="container">
                <h2>⚙️ 간편 설정 (Python 패키지 관리)</h2>
                <div class="setting-card">
                    <label>PYTHON PACKAGES (설치할 라이브러리 목록)</label>
                    <div id="libInputContainer" class="lib-input-container"></div>
                    <div class="lib-control-bar">
                        <button class="btn-add-lib-field" onclick="addLibInputField('')">+ 라이브러리 추가</button>
                    </div>
                    <button class="save-btn" onclick="saveQuickPackages()">설정 저장 및 라이브러리 설치</button>
                </div>
            </div>
        </div>

        <div id="tab-file" class="tab-content">
            <div class="container">
                <h2>📂 파일 관리 (생성, 수정, 삭제)</h2>
                <div class="file-toolbar">
                    <input type="file" id="fileUploadInput" style="display:none;" multiple onchange="uploadFiles(this)">
                    <button class="btn-action btn-upload" onclick="document.getElementById('fileUploadInput').click()">📁 파일 업로드</button>
                    <button class="btn-action btn-create" onclick="createNewFile()">+ 새 파일 생성</button>
                    <button class="btn-action btn-refresh" onclick="loadFilesList()">🔄 새로고침</button>
                </div>
                <table class="file-table">
                    <thead>
                        <tr>
                            <th>파일명</th>
                            <th style="width: 100px; text-align: right;">관리</th>
                        </tr>
                    </thead>
                    <tbody id="fileTableBody">
                        <tr><td colspan="2" style="text-align:center; color:var(--text-muted);">파일 목록 로딩 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tab-start-setting" class="tab-content">
            <div class="container">
                <h2>🚀 시작 파일 설정</h2>
                <div class="setting-card">
                    <label>STARTUP FILE (시작할 메인 .py 파일)</label>
                    <select id="startupFileSelect"></select>
                    <button class="save-btn" onclick="saveStartupFileSetting()">저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <div id="editorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="margin:0;">코드 편집기</h3>
                <button class="btn-action" style="background:var(--accent-red);" onclick="closeEditor()">닫기</button>
            </div>
            <textarea id="codeTextArea" class="code-editor" placeholder="코드를 입력하세요..."></textarea>
            <div class="modal-footer">
                <span id="saveStatus">💡 Ctrl + S를 누르면 즉시 저장됩니다.</span>
                <button class="btn-action btn-start-bot" onclick="saveFileContent()" style="margin:0;">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        let slots = {};
        let currentSlotId = "";
        let eventSource = null;
        let currentEditingFile = "";

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.target.classList.add('active');
            if(tabName === 'file') loadFilesList();
            if(tabName === 'start-setting') loadStartupFileOptions();
        }

        async function fetchSlots() {
            const res = await fetch('/get_slots');
            const data = await res.json();
            slots = data.slots;
            const slotSelect = document.getElementById('slotSelect');
            slotSelect.innerHTML = '';
            
            const keys = Object.keys(slots);
            if(keys.length === 0) {
                addNewSlot();
                return;
            }

            if(!currentSlotId || !slots[currentSlotId]) {
                currentSlotId = keys[0];
            }

            keys.forEach(id => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = slots[id].name;
                if(id === currentSlotId) opt.selected = true;
                slotSelect.appendChild(opt);
            });

            updateSlotUI();
        }

        function changeActiveSlot() {
            currentSlotId = document.getElementById('slotSelect').value;
            updateSlotUI();
        }

        function updateSlotUI() {
            const slot = slots[currentSlotId];
            if(!slot) return;
            document.getElementById('slotNameDisplay').textContent = slot.name;
            const badge = document.getElementById('slotStatusBadge');
            badge.className = `badge ${slot.status}`;
            badge.textContent = slot.status === 'online' ? '온라인 (실행 중)' : '오프라인';
            
            renderLibraryInputs(slot.packages || '');
            
            if(eventSource) eventSource.close();
            eventSource = new EventSource(`/stream_logs/${currentSlotId}`);
            eventSource.onmessage = function(e) {
                const logBox = document.getElementById('logBox');
                logBox.innerHTML += e.data + "<br>";
                logBox.scrollTop = logBox.scrollHeight;
            };
        }

        function renderLibraryInputs(packagesStr) {
            const container = document.getElementById('libInputContainer');
            container.innerHTML = '';
            let libs = packagesStr.trim() ? packagesStr.trim().split(/\s+/) : [];
            
            if(libs.length === 0) {
                addLibInputField('');
            } else {
                libs.forEach(lib => addLibInputField(lib));
            }
        }

        function addLibInputField(value) {
            const container = document.getElementById('libInputContainer');
            const row = document.createElement('div');
            row.className = 'lib-input-row';
            row.innerHTML = `
                <input type="text" class="lib-name-input" placeholder="예: discord.py" value="${value}">
                <button class="btn-remove-lib" onclick="this.parentElement.remove()">삭제</button>
            `;
            container.appendChild(row);
        }

        async function addNewSlot() {
            const res = await fetch('/add_slot', { method: 'POST' });
            const data = await res.json();
            slots = data.slots;
            currentSlotId = Object.keys(slots)[Object.keys(slots).length - 1];
            fetchSlots();
        }

        async function saveQuickPackages() {
            const inputs = document.querySelectorAll('.lib-name-input');
            let libs = [];
            inputs.forEach(input => {
                let val = input.value.trim();
                if(val) libs.push(val);
            });

            slots[currentSlotId].packages = libs.join(' ');
            await saveSlotsToServer();
            
            const res = await fetch('/install_packages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ slot_id: currentSlotId, packages: slots[currentSlotId].packages })
            });
            const data = await res.json();
            alert(data.message);
        }

        async function saveSlotsToServer() {
            await fetch('/save_slots', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ slots: slots })
            });
        }

        async function loadFilesList() {
            const res = await fetch('/get_files');
            const data = await res.json();
            const tbody = document.getElementById('fileTableBody');
            tbody.innerHTML = '';
            if(data.files.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:var(--text-muted);">생성된 파일이 없습니다.</td></tr>';
                return;
            }
            data.files.forEach(file => {
                const tr = document.createElement('tr');
                tr.className = 'file-row';
                tr.innerHTML = `
                    <td>📄 ${file}</td>
                    <td class="file-actions" style="text-align: right;">
                        <button onclick="openEditor('${file}')" title="수정">✏️</button>
                        <button onclick="deleteFile('${file}')" title="삭제">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function createNewFile() {
            const filename = prompt("생성할 파일 이름을 입력하세요 (예: bot.py):");
            if(!filename) return;
            const res = await fetch('/create_file', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ filename })
            });
            const result = await res.json();
            alert(result.message);
            loadFilesList();
        }

        async function deleteFile(filename) {
            if(!confirm(`정말 '${filename}' 파일을 삭제하시겠습니까?`)) return;
            const res = await fetch('/delete_file', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ filename })
            });
            const result = await res.json();
            alert(result.message);
            loadFilesList();
        }

        async function uploadFiles(input) {
            const formData = new FormData();
            for(let file of input.files) formData.append('files', file);
            const res = await fetch('/upload_file', { method: 'POST', body: formData });
            const result = await res.json();
            alert(result.message);
            loadFilesList();
        }

        async function openEditor(filename) {
            currentEditingFile = filename;
            document.getElementById('modalTitle').textContent = `코드 편집: ${filename}`;
            const res = await fetch(`/read_file?filename=${filename}`);
            const data = await res.json();
            if(data.status === 'success') {
                document.getElementById('codeTextArea').value = data.content;
                document.getElementById('editorModal').style.display = 'flex';
            } else {
                alert(data.message);
            }
        }

        function closeEditor() { document.getElementById('editorModal').style.display = 'none'; }

        async function saveFileContent() {
            if(!currentEditingFile) return;
            const content = document.getElementById('codeTextArea').value;
            const res = await fetch('/save_file', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ filename: currentEditingFile, content })
            });
            const data = await res.json();
            alert(data.message);
        }

        document.addEventListener('keydown', e => {
            if((e.ctrlKey || e.metaKey) && e.key === 's') {
                if(document.getElementById('editorModal').style.display === 'flex') {
                    e.preventDefault();
                    saveFileContent();
                }
            }
        });

        async function loadStartupFileOptions() {
            const res = await fetch('/get_files');
            const data = await res.json();
            const select = document.getElementById('startupFileSelect');
            select.innerHTML = '';
            data.files.forEach(f => {
                if(f.endsWith('.py')) {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = f;
                    if(slots[currentSlotId]?.startup_file === f) opt.selected = true;
                    select.appendChild(opt);
                }
            });
        }

        async function saveStartupFileSetting() {
            const filename = document.getElementById('startupFileSelect').value;
            slots[currentSlotId].startup_file = filename;
            await saveSlotsToServer();
            alert("시작 파일 설정이 저장되었습니다.");
        }

        async function startCurrentBot() {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML = `[!] 슬롯 구동 요청 중...<br>`;
            const res = await fetch('/start_bot', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ slot_id: currentSlotId })
            });
            const data = await res.json();
            logBox.innerHTML += data.message + "<br>";
            slots[currentSlotId].status = 'online';
            updateSlotUI();
        }

        async function stopCurrentBot() {
            await fetch('/stop_bot', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ slot_id: currentSlotId })
            });
            slots[currentSlotId].status = 'offline';
            updateSlotUI();
            document.getElementById('logBox').innerHTML += `<br>[!] 봇이 중지되었습니다.<br>`;
        }

        window.onload = function() {
            fetchSlots();
        };
    </script>
</body>
</html>
